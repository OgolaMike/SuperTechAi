name: Verify SuperTech AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Check independent Appwrite Worker contract
        run: npm run check:independent-worker
      - name: Validate Cloudflare Worker bundle (dry run only)
        run: npx --yes wrangler deploy --dry-run --config workers/independent-api/wrangler.toml
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/mt5-bridge/index.ts
          deno check --node-modules-dir=auto supabase/functions/scanner/index.ts
          deno check --node-modules-dir=auto supabase/functions/binance-spot/index.ts
          deno check --node-modules-dir=auto supabase/functions/binance-futures/index.ts
          deno check --node-modules-dir=auto supabase/functions/binance-futures-executor/index.ts
          deno check --node-modules-dir=auto supabase/functions/okx-futures/index.ts
          deno check --node-modules-dir=auto supabase/functions/okx-futures-executor/index.ts
      - name: Set up Python for MT5 risk tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test MT5 risk controls
        run: python -m unittest discover -s mt5-worker -p "test_*.py" -v
