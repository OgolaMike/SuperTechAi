name: SuperTech AI Trader app
on:
  pull_request:
    paths:
      - "trader-app/**"
      - ".github/workflows/trader-app.yml"
  push:
    branches: [main]
    paths:
      - "trader-app/**"
      - ".github/workflows/trader-app.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trader-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trader-app/package.json
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build separate Trader app
        run: npm run build
