name: SuperTechAi Academy video publisher

on:
  push:
    paths:
      - 'scripts/academy-video-worker.mjs'
      - 'src/components/AcademyBackgroundPublisher.tsx'
      - '.github/workflows/academy-video-publisher.yml'
  workflow_dispatch:
    inputs:
      test_lesson_id:
        description: Publish only this one lesson for a safe test (default: welcome)
        required: false
        default: welcome
        type: string
      force_refresh:
        description: Regenerate the selected lesson even if it already has real screenshots
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

concurrency:
  group: academy-video-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ACADEMY_DEMO_EMAIL: ${{ secrets.ACADEMY_DEMO_EMAIL }}
      ACADEMY_DEMO_PASSWORD: ${{ secrets.ACADEMY_DEMO_PASSWORD }}
      ACADEMY_FORCE_REFRESH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_refresh == true) }}
      ACADEMY_TEST_LESSON_ID: ${{ github.event_name == 'push' && 'welcome' || (github.event_name == 'workflow_dispatch' && inputs.test_lesson_id || '') }}
    steps:
      - name: Check out SuperTechAi
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install browser, narration and video tools
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1 kokoro-js@1.2.1
          npx playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Verify the SuperTechAi app build
        run: |
          npm run typecheck
          npm run build

      - name: Capture real app screens and publish Academy videos
        run: node scripts/academy-video-worker.mjs

      - name: Save Academy publishing report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: academy-video-publishing-report
          path: academy-worker-report.json
          if-no-files-found: ignore
          retention-days: 14
