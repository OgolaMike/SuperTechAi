name: cTrader Gateway Checks
on:
  push:
    paths:
      - "services/ctrader-gateway/**"
      - ".github/workflows/ctrader-gateway.yml"
  pull_request:
    paths:
      - "services/ctrader-gateway/**"
      - ".github/workflows/ctrader-gateway.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check gateway JavaScript syntax
        working-directory: services/ctrader-gateway
        run: npm run check
