name: SuperTech AI quality gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce Appwrite-only frontend boundary
        run: npm run check:independent
      - name: Check independent Worker security contract
        run: npm run check:independent-worker
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Validate independent Cloudflare Worker bundle (dry run only)
        run: npx --yes wrangler deploy --dry-run --config workers/independent-api/wrangler.toml

  edge-functions:
    if: github.ref != 'refs/heads/feat/appwrite-independent-platform-foundation' && github.head_ref != 'feat/appwrite-independent-platform-foundation'
    name: Legacy Supabase Edge Function static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check scanner and Binance execution functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/mt5-bridge/index.ts
          deno check --node-modules-dir=auto supabase/functions/scanner/index.ts
          deno check --node-modules-dir=auto supabase/functions/binance-spot/index.ts
          deno check --node-modules-dir=auto supabase/functions/binance-futures/index.ts
          deno check --node-modules-dir=auto supabase/functions/binance-futures-executor/index.ts
          deno check --node-modules-dir=auto supabase/functions/okx-futures/index.ts
          deno check --node-modules-dir=auto supabase/functions/okx-futures-executor/index.ts

  mt5-worker:
    name: MT5 worker strategy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile MT5 worker modules
        run: python -m py_compile mt5-worker/worker.py mt5-worker/five_minute_momentum.py
      - name: Run pure strategy and broker-volume tests
        run: python -m unittest discover -s mt5-worker -p "test_*.py"
