name: Appwrite membership build verification

on:
  pull_request:
    paths:
      - "src/**"
      - "workers/independent-api/**"
      - "docs/APPWRITE_MEMBERSHIP_APPROVAL.md"
      - "docs/APPWRITE_BUSINESS_LEDGER_FOUNDATION.md"
      - "scripts/provision-appwrite-just4you.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/appwrite-membership-check.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "workers/independent-api/**"
      - "docs/APPWRITE_MEMBERSHIP_APPROVAL.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/appwrite-membership-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run check:independent-worker
      - run: node --check scripts/provision-appwrite-just4you.mjs
