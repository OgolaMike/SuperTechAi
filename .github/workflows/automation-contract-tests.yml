name: Automation contract tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/_shared/execution-contract.ts"
      - "supabase/functions/_shared/execution-contract_test.ts"
      - "supabase/functions/_shared/automation-status.ts"
      - "supabase/functions/_shared/automation-status_test.ts"
      - "supabase/functions/automation-status/**"
      - "supabase/config.toml"
      - ".github/workflows/automation-contract-tests.yml"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: ["automation/unified-mobile-cloud"]
    paths:
      - "supabase/functions/_shared/execution-contract.ts"
      - "supabase/functions/_shared/execution-contract_test.ts"
      - "supabase/functions/_shared/automation-status.ts"
      - "supabase/functions/_shared/automation-status_test.ts"
      - "supabase/functions/automation-status/**"
      - "supabase/config.toml"
      - ".github/workflows/automation-contract-tests.yml"

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check automation status function
        run: deno check supabase/functions/automation-status/index.ts
      - name: Run execution contract tests
        run: deno test supabase/functions/_shared/execution-contract_test.ts supabase/functions/_shared/automation-status_test.ts
