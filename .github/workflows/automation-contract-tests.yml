name: Automation contract tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/_shared/execution-contract.ts"
      - "supabase/functions/_shared/execution-contract_test.ts"
      - "supabase/functions/_shared/automation-status.ts"
      - "supabase/functions/_shared/automation-status_test.ts"
      - "supabase/functions/automation-status/**"
      - "supabase/functions/binance-futures-executor/**"
      - "supabase/functions/okx-futures-executor/**"
      - "supabase/functions/ctrader-cloud-reconcile/**"
      - "supabase/functions/_shared/ctrader-risk-sizing.ts"
      - "supabase/functions/_shared/ctrader-risk-sizing_test.ts"
      - "supabase/functions/_shared/ctrader-execution-preflight.ts"
      - "supabase/functions/_shared/ctrader-execution-preflight_test.ts"
      - "supabase/functions/_shared/ctrader-order-payload.ts"
      - "supabase/functions/_shared/ctrader-order-payload_test.ts"
      - "supabase/functions/_shared/ctrader-margin-check.ts"
      - "supabase/functions/_shared/ctrader-margin-check_test.ts"
      - "supabase/functions/_shared/ctrader-account-margin.ts"
      - "supabase/functions/_shared/ctrader-account-margin_test.ts"
      - "supabase/functions/scanner/binanceSpotAutomation.ts"
      - ".github/workflows/automation-contract-tests.yml"
      - "supabase/config.toml"
      - "docs/UNIFIED_AUTOMATION_ARCHITECTURE.md"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: ["automation/unified-mobile-cloud"]
    paths:
      - "supabase/functions/_shared/execution-contract.ts"
      - "supabase/functions/_shared/execution-contract_test.ts"
      - "supabase/functions/_shared/automation-status.ts"
      - "supabase/functions/_shared/automation-status_test.ts"
      - "supabase/functions/automation-status/**"
      - "supabase/functions/binance-futures-executor/**"
      - "supabase/functions/okx-futures-executor/**"
      - "supabase/functions/ctrader-cloud-reconcile/**"
      - "supabase/functions/_shared/ctrader-risk-sizing.ts"
      - "supabase/functions/_shared/ctrader-risk-sizing_test.ts"
      - "supabase/functions/_shared/ctrader-execution-preflight.ts"
      - "supabase/functions/_shared/ctrader-execution-preflight_test.ts"
      - "supabase/functions/_shared/ctrader-order-payload.ts"
      - "supabase/functions/_shared/ctrader-order-payload_test.ts"
      - "supabase/functions/_shared/ctrader-margin-check.ts"
      - "supabase/functions/_shared/ctrader-margin-check_test.ts"
      - "supabase/functions/scanner/binanceSpotAutomation.ts"
      - "supabase/config.toml"
      - ".github/workflows/automation-contract-tests.yml"
      - "docs/UNIFIED_AUTOMATION_ARCHITECTURE.md"
      - "src/**"

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check automation status and exchange executors
        run: deno check supabase/functions/_shared/ctrader-account-margin.ts supabase/functions/_shared/ctrader-margin-check.ts supabase/functions/_shared/ctrader-risk-sizing.ts supabase/functions/_shared/ctrader-execution-preflight.ts supabase/functions/_shared/ctrader-order-payload.ts supabase/functions/ctrader-cloud-reconcile/index.ts supabase/functions/automation-status/index.ts supabase/functions/binance-futures-executor/index.ts supabase/functions/okx-futures-executor/index.ts supabase/functions/scanner/binanceSpotAutomation.ts
      - name: Run execution contract tests
        run: deno test supabase/functions/_shared/execution-contract_test.ts supabase/functions/_shared/automation-status_test.ts supabase/functions/_shared/ctrader-risk-sizing_test.ts supabase/functions/_shared/ctrader-margin-check_test.ts supabase/functions/_shared/ctrader-account-margin_test.ts supabase/functions/_shared/ctrader-execution-preflight_test.ts supabase/functions/_shared/ctrader-order-payload_test.ts
