name: Automation contract tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/_shared/execution-contract.ts"
      - "supabase/functions/_shared/execution-contract_test.ts"
      - ".github/workflows/automation-contract-tests.yml"
  push:
    branches: ["automation/unified-mobile-cloud"]
    paths:
      - "supabase/functions/_shared/execution-contract.ts"
      - "supabase/functions/_shared/execution-contract_test.ts"
      - ".github/workflows/automation-contract-tests.yml"

permissions:
  contents: read

jobs:
  execution-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run execution contract tests
        run: deno test supabase/functions/_shared/execution-contract_test.ts
