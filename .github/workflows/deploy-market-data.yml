name: Deploy SuperTech AI market data Worker

on:
  push:
    branches:
      - fix/appwrite-live-market-data-worker
    paths:
      - "workers/market-data/**"
      - ".github/workflows/deploy-market-data.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy public market-data Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy --config workers/market-data/wrangler.toml
