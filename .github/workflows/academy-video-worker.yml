name: SuperTechAi Academy video publisher

on:
  pull_request:
    paths:
      - "scripts/academy_video_worker/**"
      - "public/academy-demo.html"
      - ".github/workflows/academy-video-worker.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/academy_video_worker/**"
      - "public/academy-demo.html"
      - ".github/workflows/academy-video-worker.yml"

concurrency:
  group: academy-video-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Academy lesson scripts
        uses: actions/checkout@v4

      - name: Set up Node for the Academy demo build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build SuperTechAi demo assets
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-onnx-int8-v1

      - name: Validate worker syntax
        run: python -m py_compile scripts/academy_video_worker/generate_videos.py

      - name: Install system video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install open-source voice renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro-onnx==0.6.1" "soundfile>=0.12" "Pillow>=10" "requests>=2.31" "numpy>=2.0" "playwright>=1.49"

      - name: Install headless Chromium for screen recording
        run: python -m playwright install --with-deps chromium

      - name: Check background publisher credentials
        id: publisher_credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in repository Actions secrets to enable automatic video publishing."
          fi

      - name: Generate and publish missing Academy lessons
        if: ${{ github.event_name != 'pull_request' && steps.publisher_credentials.outputs.ready == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KOKORO_MODEL_DIR: .cache/kokoro
        run: python scripts/academy_video_worker/generate_videos.py
