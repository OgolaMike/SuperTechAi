name: SuperTechAi Academy video publisher

on:
  pull_request:
    paths:
      - "scripts/academy_video_worker/**"
      - ".github/workflows/academy-video-worker.yml"
  workflow_dispatch:

concurrency:
  group: academy-video-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Academy lesson scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-onnx-int8-v1

      - name: Validate worker syntax
        run: python -m py_compile scripts/academy_video_worker/generate_videos.py

      - name: Install system video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install open-source voice renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro-onnx==0.6.1" "soundfile>=0.12" "Pillow>=10" "requests>=2.31" "numpy>=2.0" "playwright>=1.49"

      - name: Install headless Chromium for screen recording
        run: python -m playwright install --with-deps chromium

      - name: Check background publisher credentials
        id: publisher_credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACADEMY_APP_URL: ${{ secrets.ACADEMY_APP_URL }}
          ACADEMY_PLAYWRIGHT_STORAGE_STATE_BASE64: ${{ secrets.ACADEMY_PLAYWRIGHT_STORAGE_STATE_BASE64 }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$ACADEMY_APP_URL" ] && [ -n "$ACADEMY_PLAYWRIGHT_STORAGE_STATE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Configure SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ACADEMY_APP_URL and ACADEMY_PLAYWRIGHT_STORAGE_STATE_BASE64 in repository Actions secrets before manually publishing."
          fi

      - name: Generate and publish missing Academy lessons
        if: ${{ github.event_name == 'workflow_dispatch' && steps.publisher_credentials.outputs.ready == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KOKORO_MODEL_DIR: .cache/kokoro
          ACADEMY_APP_URL: ${{ secrets.ACADEMY_APP_URL }}
          ACADEMY_PLAYWRIGHT_STORAGE_STATE_BASE64: ${{ secrets.ACADEMY_PLAYWRIGHT_STORAGE_STATE_BASE64 }}
        run: python scripts/academy_video_worker/generate_videos.py
