[functions.scanner]
# Scanner cron requests are authenticated by the private Vault-backed X-Scanner-Cron-Secret header in index.ts.
verify_jwt = false

[functions.push]
# Public VAPID-key lookup uses the anon key; POST actions validate the user JWT inside the function.
verify_jwt = false

[functions.crypto-movers]
verify_jwt = true

[functions.admin-users]
verify_jwt = true

[functions.mt5-bridge]
verify_jwt = false

[functions.automation-status]
verify_jwt = true

[functions.finance]
verify_jwt = true

[functions.marketing-ai]
verify_jwt = true

[functions.marketing-image]
verify_jwt = true

[functions.ctrader-connect]
verify_jwt = true

[functions.ctrader-callback]
verify_jwt = false

[functions.ctrader-disconnect]
verify_jwt = true

[functions.ctrader-discover-accounts]
verify_jwt = true

[functions.ctrader-cloud-reconcile]
verify_jwt = true
